services:
  odyle:
    build: .
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - odyle-data:/pb/pb_data
    # Discord credentials (docs/discord-setup.md), off-host backups and the trusted proxy
    # header (docs/deployment.md); the service also starts without the file.
    env_file:
      - path: .env.backend
        required: false
    command: ["--origins=http://127.0.0.1:8090"]
    restart: unless-stopped
    # Docker keeps at most 3 × 10 MB of the server's log (docker compose logs).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # A ceiling for the whole server: SQLite, the caches and the jobs fit well under it.
    mem_limit: 1g
volumes:
  odyle-data:
