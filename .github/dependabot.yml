# Keeps the pinned GitHub Actions, npm packages, the backend's Go modules (PocketBase
# among them) and the Docker base images current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The web build uses Node's long-term support releases (even majors) only.
    ignore:
      - dependency-name: node
        versions: ["23.x", "25.x", "27.x", "29.x"]
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
