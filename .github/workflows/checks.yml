name: Dashboard checks
# Pushes to main run the same checks in the release workflow.
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - run: npm run lint
      - name: gofmt
        run: test -z "$(gofmt -l backend)" || { gofmt -l backend; exit 1; }
      - run: npm test
      - run: npm run test:backend
      # The race detector, every fuzz test fuzzed for 10 s, staticcheck (backend/staticcheck.conf)
      # and govulncheck, built with the Go of backend/go.mod.
      - name: Go race detector, fuzzing, staticcheck and govulncheck
        working-directory: backend
        env:
          GOTOOLCHAIN: local
        run: |
          go test -race ./...
          for f in $(go test -list '^Fuzz' ./odyle | grep '^Fuzz'); do go test -run '^$' -fuzz "^$f\$" -fuzztime 10s ./odyle; done
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # The dashboard first: the backend embeds it, and the integration tests read its page.
      - run: npm run build
      - run: npm run backend:build
      - run: npm run test:integration
        timeout-minutes: 15
      # Browser checks of the built dashboard (tests/ui.test.mjs).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        timeout-minutes: 25
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-static
          path: dist
