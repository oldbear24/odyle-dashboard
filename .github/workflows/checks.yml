name: Dashboard checks
# Pull requests only: a push to a branch with a pull request would run everything twice.
# Every change reaches main through a pull request, and the release workflow runs these same
# checks on each push to main (release: true); a branch without a pull request can be checked
# by hand.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Called by the release, which checks the version and builds the image itself
        type: boolean
        default: false
permissions:
  contents: read
# A newer push to the same pull request replaces a run still going; the release's own run of the
# checks is apart from a run by hand on main.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# The checks run side by side; the job named checks, which branch protection requires, passes
# once every other job has (or was skipped: the container job, in the release).
jobs:
  web:
    name: "Web: version, lint and unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # main and the release tags, for the version check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # A change to what ships bumps package.json's version (CLAUDE.md, Versioning).
      - name: Version bump
        if: ${{ !inputs.release }}
        run: node scripts/version.mjs check ${{ github.event.pull_request.base.sha }}
      - run: npm ci
      - run: npm run lint
      - run: npm test

  go-race:
    name: "Go: race detector (${{ matrix.shard }}/3)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Every Go test under the race detector, built with the Go of backend/go.mod: the odyle
      # package's tests (most of the time) split by name into three parts, the first part with
      # the other packages too.
      - name: Race detector
        working-directory: backend
        env:
          GOTOOLCHAIN: local
          SHARD: ${{ matrix.shard }}
        run: |
          tests=$(grep -ho '^func Test[A-Za-z0-9_]*' odyle/*_test.go | cut -c6- | grep -v '^TestMain$' | sort -u | awk -v shard="$SHARD" '(NR - 1) % 3 == shard - 1' | paste -sd '|')
          go test -race -run "^(${tests})\$" ./odyle
          if [ "$SHARD" = 1 ]; then go test -race $(go list ./... | grep -v '/odyle$'); fi

  go-fuzz:
    name: "Go: fuzzing"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Every fuzz test fuzzed for 10 s.
      - name: Fuzzing
        working-directory: backend
        env:
          GOTOOLCHAIN: local
        run: for f in $(go test -list '^Fuzz' ./odyle | grep '^Fuzz'); do go test -run '^$' -fuzz "^$f\$" -fuzztime 10s ./odyle; done

  go-lint:
    name: "Go: gofmt, vet, staticcheck and govulncheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l backend)" || { gofmt -l backend; exit 1; }
      # vet with and without the test build's fixtures, staticcheck (backend/staticcheck.conf)
      # and govulncheck.
      - name: vet, staticcheck and govulncheck
        working-directory: backend
        env:
          GOTOOLCHAIN: local
        run: |
          go vet ./...
          go vet -tags odyletest ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  browser:
    name: "Browser: built dashboard at ${{ matrix.width }} px"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        width: [1280, 390]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
      # The dashboard first: the backend embeds it, and the integration tests read its page.
      - run: npm run build
      - run: npm run backend:build
      - run: npm run test:integration
        if: matrix.width == 1280
        timeout-minutes: 15
      # Browser checks of the built dashboard (tests/ui.test.mjs), at 1280 px and at phone width
      # (390 px: the layout, the bottom bar and the axe checks of phones).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        timeout-minutes: 25
        env:
          ODYLE_UI_WIDTH: ${{ matrix.width }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.width == 1280
        with:
          name: dashboard-static
          path: dist

  container:
    name: "Container: web build and upgrade"
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The container's web build sees only what the Dockerfile copies; a file the dashboard needs and
      # it misses fails here, not in the release.
      - name: Container web build
        run: docker build --target web .
      # The whole image, started on a data volume the latest release made (scripts/image-smoke.sh),
      # as the release does before it pushes one.
      - name: Container image upgrade
        run: |
          docker build -t odyle-candidate .
          bash scripts/image-smoke.sh odyle-candidate "ghcr.io/${GITHUB_REPOSITORY,,}:latest"

  checks:
    name: checks
    if: always()
    needs: [web, go-race, go-fuzz, go-lint, browser, container]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || [ "$result" = skipped ] || exit 1; done
