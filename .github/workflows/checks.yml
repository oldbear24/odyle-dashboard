name: Dashboard checks
# Pushes to main run the same checks in the release workflow.
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run backend:install
      - run: npm run test:integration
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-static
          path: dist
