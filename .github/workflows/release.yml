name: Dashboard release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Releases run one at a time; a newer push replaces a release still waiting to start.
concurrency:
  group: release
  cancel-in-progress: false
# What reached main runs the checks of a pull request again (checks.yml, its jobs side by side),
# while the server's ZIPs and the container image are built next to them. The image is pushed
# under its commit's tag only (sha-<commit>); the publish job gives it the version and latest
# tags and creates the GitHub release once every check passed, so nothing reaches operators
# before that.
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release tags, for scripts/version.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # package.json's semantic version, bumped by each change (CLAUDE.md, Versioning). A version
      # already released ships nothing when only docs or tests changed, and fails when shipped
      # code changed without a bump.
      - id: version
        run: node scripts/version.mjs release

  checks:
    uses: ./.github/workflows/checks.yml
    with:
      release: true

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - run: npm run build
      # The server for Linux and Windows, with the migrations and the dashboard built in
      # (backend/web).
      - name: Package the server
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p artifacts
          cp -r dist/. backend/web/dist/
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; exe=""; [ "$os" = windows ] && exe=.exe
            name="odyle-dashboard-$VERSION-$os-$arch"
            mkdir -p "artifacts/$name"
            (cd backend && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X github.com/oldbear24/odyle-dashboard/backend/odyle.Version=$VERSION" -o "../artifacts/$name/odyle$exe" .)
            (cd "artifacts/$name" && zip -qr "../$name.zip" .)
            (cd artifacts && sha256sum "$name.zip" > "$name.zip.sha256")
            rm -r "artifacts/$name"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: odyle-dashboard
          path: |
            artifacts/*.zip
            artifacts/*.sha256

  image:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No emulation: the Dockerfile builds on the runner's own platform for every architecture.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The image for this runner first, loaded into Docker: it starts on a data volume the
      # previous release made and answers its healthcheck (scripts/image-smoke.sh) before
      # anything is pushed. The push below reuses its layers.
      - name: Container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: odyle-candidate
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
      - name: Container image upgrade
        run: bash scripts/image-smoke.sh odyle-candidate "ghcr.io/${GITHUB_REPOSITORY,,}:latest"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [version, checks, build, image]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # The release notes start with what the version changed, from CHANGELOG.md (src/changelog.js);
      # checked out first, as checkout cleans the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            CHANGELOG.md
            package.json
            src/changelog.js
            scripts/changelog.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: odyle-dashboard
          path: artifacts
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The pushed image gets its version and becomes latest, without being built again.
      - name: Tag the container image
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$repository:$VERSION" --tag "$repository:latest" "$IMAGE"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
          node scripts/changelog.mjs notes "$VERSION" > notes.md
          cat >> notes.md <<EOF

          Container image (linux/amd64, linux/arm64): \`docker pull $image\`

          \`odyle-dashboard-$VERSION-<os>-<arch>.zip\` (linux-amd64, linux-arm64, windows-amd64) holds the server \`odyle\`, with the dashboard and the migrations built in; run \`odyle serve\`. Migrations run at start.
          EOF
          gh release create "v$VERSION" artifacts/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Odyle dashboard $VERSION" --notes-file notes.md --generate-notes --latest
