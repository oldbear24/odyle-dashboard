name: Dashboard release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Releases run one at a time; a newer push replaces a release still waiting to start.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: version
        run: echo "version=$(node -p "require('./package.json').version").$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run backend:install
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      # Same layout PocketBase expects next to its binary, ready to upload to PocketHost.
      - name: Package PocketBase bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts/bundle
          cp -r backend/pb_hooks backend/pb_migrations artifacts/bundle/
          cp -r dist artifacts/bundle/pb_public
          archive="odyle-dashboard-$VERSION-pocketbase.zip"
          (cd artifacts/bundle && zip -qr "../$archive" .)
          (cd artifacts && sha256sum "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: odyle-dashboard
          path: |
            artifacts/*.zip
            artifacts/*.sha256

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.build.outputs.version }}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: odyle-dashboard
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
          cat > notes.md <<EOF
          Container image (linux/amd64, linux/arm64): \`docker pull $image\`

          \`odyle-dashboard-$VERSION-pocketbase.zip\` holds \`pb_hooks\`, \`pb_migrations\` and \`pb_public\` for a PocketBase or PocketHost instance; restart it after uploading.
          EOF
          gh release create "v$VERSION" artifacts/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Odyle dashboard $VERSION" --notes-file notes.md --generate-notes --latest
